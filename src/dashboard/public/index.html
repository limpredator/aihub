<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cerdik AI Receptionist — Calls</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f8;
    --panel: #ffffff;
    --border: #e4e6ec;
    --text: #15171f;
    --text-dim: #6b7080;
    --text-faint: #9398a6;
    --accent: #4f46e5;
    --accent-weak: #eef0ff;
    --shadow: 0 1px 2px rgba(20, 20, 40, 0.04), 0 1px 1px rgba(20, 20, 40, 0.03);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --panel: #171a22;
      --border: #272b36;
      --text: #e8e9ee;
      --text-dim: #9a9fae;
      --text-faint: #686d7c;
      --accent: #818cf8;
      --accent-weak: #1f2142;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  #home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-dim); cursor: pointer; flex-shrink: 0;
  }
  #home-btn:hover { background: var(--accent-weak); color: var(--accent); border-color: var(--accent); }
  #home-btn svg { width: 17px; height: 17px; }
  #profile-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-dim); cursor: pointer; flex-shrink: 0;
  }
  #profile-btn:hover { background: var(--accent-weak); color: var(--accent); border-color: var(--accent); }
  #profile-btn svg { width: 17px; height: 17px; }
  #test-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-dim); cursor: pointer; flex-shrink: 0;
  }
  #test-btn:hover { background: var(--accent-weak); color: var(--accent); border-color: var(--accent); }
  #test-btn svg { width: 17px; height: 17px; }
  header .brand .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .subtitle { font-size: 12px; color: var(--text-faint); }
  .stats { display: flex; gap: 20px; }
  .stat { text-align: right; }
  .stat .n { font-size: 18px; font-weight: 700; line-height: 1.1; }
  .stat .lbl { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; }

  main { display: flex; height: calc(100vh - 57px); }

  #list {
    width: 380px; flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex; flex-direction: column;
  }
  .search-wrap { padding: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .search-wrap input {
    width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }

  .row {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .row:hover { background: var(--accent-weak); }
  .row.active { background: var(--accent-weak); box-shadow: inset 3px 0 0 var(--accent); }
  .avatar {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .row-body { min-width: 0; flex: 1; }
  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row .caller { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .time { font-size: 11px; color: var(--text-faint); flex-shrink: 0; }
  .row .preview {
    font-size: 12px; color: var(--text-dim); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .pill {
    display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 9px;
    border-radius: 100px; letter-spacing: .02em; text-transform: uppercase;
    margin-top: 4px;
  }
  .pill.routed { background: #dbeafe; color: #1d4ed8; }
  .pill.message_taken { background: #fef3c7; color: #b45309; }
  .pill.fallback { background: #fee2e2; color: #b91c1c; }
  .pill.hangup { background: #e5e7eb; color: #4b5563; }
  .pill.live { background: #dcfce7; color: #15803d; }
  @media (prefers-color-scheme: dark) {
    .pill.routed { background: #1e3a8a55; color: #93c5fd; }
    .pill.message_taken { background: #78350f55; color: #fcd34d; }
    .pill.fallback { background: #7f1d1d55; color: #fca5a5; }
    .pill.hangup { background: #37415155; color: #d1d5db; }
    .pill.live { background: #14532d55; color: #86efac; }
  }

  /* Custom pill-styled dropdown (outcome / follow-up): a native <select>'s
     open menu can't be themed, which looked like a plain OS popup — this
     renders its own menu instead so it matches the rest of the dark UI. */
  .dd { position: relative; display: inline-block; }
  .dd-btn {
    font: inherit; font-size: 12px; font-weight: 600; text-transform: capitalize;
    border: 1px solid transparent; border-radius: 999px; padding: 4px 10px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    background: var(--border); color: var(--text-dim);
  }
  .dd-btn:hover { border-color: var(--accent); }
  .dd-btn:disabled { opacity: .6; cursor: default; }
  .dd-btn .dd-caret { opacity: .6; margin-left: 2px; }
  .dd-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dd-dot.routed, .dd-dot.contacted { background: #2563eb; }
  .dd-dot.message_taken, .dd-dot.pending { background: #d97706; }
  .dd-dot.fallback { background: #dc2626; }
  .dd-dot.hangup { background: #6b7280; }
  .dd-dot.live { background: #16a34a; }
  .dd-dot.done { background: #16a34a; }
  .dd-btn.routed, .dd-btn.contacted { background: #dbeafe; color: #1d4ed8; }
  .dd-btn.message_taken, .dd-btn.pending { background: #fef3c7; color: #b45309; }
  .dd-btn.fallback { background: #fee2e2; color: #b91c1c; }
  .dd-btn.hangup { background: #e5e7eb; color: #4b5563; }
  .dd-btn.live, .dd-btn.done { background: #dcfce7; color: #15803d; }
  @media (prefers-color-scheme: dark) {
    .dd-btn.routed, .dd-btn.contacted { background: #1e3a8a55; color: #93c5fd; }
    .dd-btn.message_taken, .dd-btn.pending { background: #78350f55; color: #fcd34d; }
    .dd-btn.fallback { background: #7f1d1d55; color: #fca5a5; }
    .dd-btn.hangup { background: #37415155; color: #d1d5db; }
    .dd-btn.live, .dd-btn.done { background: #14532d55; color: #86efac; }
  }
  .dd-menu {
    display: none; position: absolute; z-index: 30; top: calc(100% + 6px); left: 0;
    min-width: 170px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); padding: 6px;
  }
  .dd-menu.open { display: block; }
  .dd-item {
    display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 7px;
    font-size: 13px; cursor: pointer; color: var(--text);
  }
  .dd-item:hover { background: var(--accent-weak); }
  .dd-item.active { font-weight: 600; }

  #detail { flex: 1; overflow-y: auto; padding: 28px 32px; }
  #detail .inner { max-width: 1100px; }

  .home-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .home-stats .card { margin-bottom: 0; text-align: center; padding: 18px; }
  .home-stats .card .n { font-size: 26px; font-weight: 700; }
  .home-stats .card .lbl { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  .home-recent .row { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; background: var(--panel); }
  .home-recent .row:hover { border-color: var(--accent); }
  .empty { color: var(--text-faint); padding: 40px 24px; text-align: center; font-size: 13.5px; }

  .detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .detail-head .avatar { width: 48px; height: 48px; font-size: 16px; }
  .detail-head h2 { margin: 0; font-size: 18px; }
  .detail-head .meta-line { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
  .card label { display: block; font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .card p { margin: 0; line-height: 1.55; font-size: 14px; }

  .summary { background: var(--accent-weak); border: 1px solid var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .summary label { color: var(--accent); }

  .grid-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .grid-fields .field label { font-size: 10.5px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; display: block; }
  .grid-fields .field .val { font-size: 13.5px; font-weight: 500; }

  .transcript { display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 80%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
  .bubble.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.caller { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bubble .who { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .6; margin-bottom: 2px; }
  .bubble.partial { opacity: .55; }
  #test-transcript { min-height: 120px; max-height: 50vh; overflow-y: auto; padding: 4px 2px; }

  .form-field { margin-bottom: 16px; }
  .form-field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .form-field .hint { font-size: 11.5px; color: var(--text-faint); margin-bottom: 6px; font-weight: normal; text-transform: none; letter-spacing: normal; }
  .form-field input, .form-field textarea {
    width: 100%; font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 11px; resize: vertical; outline: none;
  }
  .form-field textarea { min-height: 90px; line-height: 1.5; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .form-field input:focus, .form-field textarea:focus { border-color: var(--accent); }

  .save-bar { display: flex; align-items: center; gap: 12px; position: sticky; bottom: 0; background: var(--bg); padding: 14px 0; }
  .btn-primary {
    font: inherit; font-size: 13.5px; font-weight: 600; color: #fff; background: var(--accent);
    border: none; border-radius: 9px; padding: 10px 18px; cursor: pointer;
  }
  .btn-primary:hover { opacity: .92; }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .save-status { font-size: 12.5px; color: var(--text-dim); }
  .save-status.ok { color: #15803d; }
  .save-status.err { color: #b91c1c; }

  .import-card label { display: block; font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .import-card > .hint { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }
  #import-text {
    width: 100%; min-height: 120px; font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; resize: vertical; outline: none; line-height: 1.5;
  }
  #import-text:focus { border-color: var(--accent); }
  .import-or {
    display: flex; align-items: center; gap: 10px; margin: 14px 0;
    font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em;
  }
  .import-or::before, .import-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .import-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .import-row input[type="text"] {
    flex: 1; font: inherit; font-size: 13.5px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; outline: none;
  }
  .import-row input[type="text"]:focus { border-color: var(--accent); }
  .import-row input[type="file"] {
    flex: 1; font: inherit; font-size: 13px; color: var(--text-dim);
  }
  .btn-secondary {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--border);
    border: none; border-radius: 9px; padding: 9px 14px; cursor: pointer; white-space: nowrap;
  }
  .btn-secondary:hover { background: var(--accent-weak); color: var(--accent); }
  .btn-secondary:disabled { opacity: .6; cursor: default; }
  .import-hint { font-size: 11.5px; color: var(--text-faint); margin-top: -4px; margin-bottom: 14px; }
  .import-status { font-size: 12.5px; color: var(--text-dim); margin-top: 10px; }
  .import-status.ok { color: #15803d; }
  .import-status.err { color: #b91c1c; }

  .details-card { padding: 0; overflow: hidden; }
  .details-card > summary {
    list-style: none; cursor: pointer; padding: 14px 18px; font-size: 13.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; color: var(--text);
  }
  .details-card > summary::-webkit-details-marker { display: none; }
  .details-card > summary::after {
    content: "▸"; color: var(--text-faint); font-size: 11px; transition: transform .15s;
  }
  .details-card[open] > summary::after { transform: rotate(90deg); }
  .details-card > summary .sub { font-size: 12px; font-weight: normal; color: var(--text-faint); margin-left: 8px; }
  .details-card .details-body { padding: 4px 18px 18px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <button id="home-btn" title="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </button>
    <button id="profile-btn" title="Company profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4 8 4v14"/><path d="M9 9h1m4 0h1M9 13h1m4 0h1M9 17h1m4 0h1"/></svg>
    </button>
    <button id="test-btn" title="Test call console">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </button>
    <span class="dot"></span>
    <div>
      <h1>Cerdik AI Receptionist</h1>
      <div class="subtitle">Call log</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n" id="stat-total">0</div><div class="lbl">Calls</div></div>
    <div class="stat"><div class="n" id="stat-messages">0</div><div class="lbl">Messages</div></div>
    <div class="stat"><div class="n" id="stat-fallback">0</div><div class="lbl">Fallback</div></div>
  </div>
</header>
<main>
  <div id="list">
    <div class="search-wrap"><input id="search" type="text" placeholder="Search caller or outcome…" /></div>
    <div id="rows"><div class="empty">Loading…</div></div>
  </div>
  <div id="detail"><div class="empty">Select a call on the left.</div></div>
</main>
<script>
let calls = [];
let selectedId = null;
let query = "";
let currentView = "calls"; // "calls" | "profile" — which panel #detail is showing

const TENANT_CONFIG_FIELDS = [
  { key: "companyName", label: "Company name", kind: "input" },
  { key: "companyDescription", label: "Short description", kind: "input", hint: 'Follows "You are the phone receptionist for {name}, …" — e.g. "a Petaling Jaya-based business phone / IP-PABX supplier".' },
  { key: "languages", label: "Languages", kind: "input", hint: 'e.g. "English, Bahasa Malaysia, or Mandarin"' },
  { key: "companyFacts", label: "Company facts", kind: "textarea", hint: "One fact per line, starting with \"- \". Hours, location, tone, what you do." },
  { key: "products", label: "Products / services", kind: "textarea", hint: "Free-form catalog the AI will quote directly — use your own section headers and bullets." },
  { key: "howItFitsTogether", label: "How it fits together", kind: "input", hint: "One sentence describing how your products relate to each other." },
  { key: "simpleTerms", label: "Simple terms", kind: "textarea", hint: "Jargon the AI can explain if asked, one per line." },
  { key: "quickAnswers", label: "Quick answers", kind: "textarea", hint: "Common question → answer pairs, one per line." },
  { key: "neverDoThis", label: "Never do this", kind: "textarea", hint: "Things the AI must hand off to a person instead of answering — prices, promises, anything unconfirmed." },
];
const EDITABLE_OUTCOMES = ["routed", "message_taken", "fallback", "hangup"];

// How the call ended — set automatically by the call-handling code, but
// editable here for when it got misclassified.
const OUTCOME_OPTIONS = [
  { value: "routed", label: "Routed", dot: "routed", hint: "Connected to a person at an extension." },
  { value: "message_taken", label: "Message taken", dot: "message_taken", hint: "No one was free — the AI took down the caller's details for someone to call back." },
  { value: "fallback", label: "Fallback", dot: "fallback", hint: "Something went wrong (STT/TTS/system) and the call had to be handed off." },
  { value: "hangup", label: "Hangup", dot: "hangup", hint: "The caller hung up before anything useful happened." },
];

// Separate from outcome: whether staff has actually followed up on a
// message/lead yet. Defaults to "pending" until someone sets it.
const FOLLOWUP_OPTIONS = [
  { value: "pending", label: "Pending", dot: "pending" },
  { value: "contacted", label: "Contacted", dot: "contacted" },
  { value: "done", label: "Done", dot: "done" },
];

function badgeClass(outcome) {
  return outcome || "live";
}

function outcomeLabel(outcome) {
  return (outcome || "in progress").replace(/_/g, " ");
}

function ddHtml(id, options, current, fallbackLabel, fallbackDot) {
  const cur = options.find((o) => o.value === current);
  const label = cur ? cur.label : (fallbackLabel || "—");
  const dot = cur ? cur.dot : (fallbackDot || "live");
  return `
    <div class="dd">
      <button type="button" class="dd-btn ${dot}" id="${id}">
        <span class="dd-dot ${dot}"></span>${escapeHtml(label)}
        <svg class="dd-caret" viewBox="0 0 10 6" width="9" height="6"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div class="dd-menu" id="${id}-menu">
        ${options.map((o) => `<div class="dd-item ${o.value === current ? "active" : ""}" data-value="${o.value}" title="${escapeHtml(o.hint || "")}"><span class="dd-dot ${o.dot}"></span>${escapeHtml(o.label)}</div>`).join("")}
      </div>
    </div>`;
}

function wireDropdown(id, onSelect) {
  const btn = document.getElementById(id);
  const menu = document.getElementById(id + "-menu");
  if (!btn || !menu) return;
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    document.querySelectorAll(".dd-menu.open").forEach((m) => { if (m !== menu) m.classList.remove("open"); });
    menu.classList.toggle("open");
  });
  menu.querySelectorAll(".dd-item").forEach((item) => {
    item.addEventListener("click", (e) => {
      e.stopPropagation();
      menu.classList.remove("open");
      onSelect(item.dataset.value);
    });
  });
}

document.addEventListener("click", () => {
  document.querySelectorAll(".dd-menu.open").forEach((m) => m.classList.remove("open"));
});

async function patchCall(callId, patch) {
  const res = await fetch(`/api/calls/${encodeURIComponent(callId)}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(patch),
  });
  if (!res.ok) throw new Error(await res.text());
}

function initials(caller) {
  if (!caller || caller === "Unknown caller") return "?";
  const digits = caller.replace(/\D/g, "");
  return digits ? digits.slice(-2) : caller.slice(0, 2).toUpperCase();
}

function fmtTime(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString();
}

function fmtRelative(iso) {
  if (!iso) return "—";
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.round(hrs / 24) + "d ago";
}

function escapeHtml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function matchesQuery(c) {
  if (!query) return true;
  const haystack = (c.caller + " " + (c.outcome || "") + " " + (c.summary || "")).toLowerCase();
  return haystack.includes(query);
}

function renderStats() {
  document.getElementById("stat-total").textContent = calls.length;
  document.getElementById("stat-messages").textContent = calls.filter((c) => c.outcome === "message_taken").length;
  document.getElementById("stat-fallback").textContent = calls.filter((c) => c.outcome === "fallback").length;
}

function render() {
  renderStats();
  const rowsEl = document.getElementById("rows");
  const filtered = calls.filter(matchesQuery);
  if (filtered.length === 0) {
    rowsEl.innerHTML = '<div class="empty">' + (calls.length === 0 ? "No calls yet." : "No calls match your search.") + '</div>';
    return;

    <div class="row ${c.callId === selectedId ? "active" : ""}" data-id="${c.callId}">

}

          <div class="field"><label>Started</label><div class="val">${fmtTime(call.startedAt)}</div></div>

      alert("Failed to update follow-up status: " + err.message);
    }
  });

// --- Test call console: talk to the agent live via mic/speaker, no phone
// network involved. Audio both ways is raw PCM16LE @ 8kHz mono over a
// single WebSocket — the same format Speechmatics/ElevenLabs already use
// server-side (see src/call/testCallSession.ts), so no server-side codec
// work was needed; the browser does the mic resampling and output pacing.
let testSocket = null;
let testAudioCtx = null;
let testStream = null;
let testProcessor = null;
let testSource = null;
let testActive = false;
let testPlayHead = 0;
let testPlayingSources = [];
let testLivePartialBubble = null;

function renderTest() {
  const detailEl = document.getElementById("detail");
  detailEl.innerHTML = `
    <div class="inner">
      <div class="detail-head"><div><h2>Test call console</h2><div class="meta-line">Talk to this agent live, right in the browser — no phone network involved.</div></div></div>
      <div class="card">
        <div style="display:flex; align-items:center; gap: 12px; margin-bottom: 14px;">
          <button type="button" class="btn-primary" id="test-toggle">Start test call</button>
          <span id="test-status" style="color: var(--text-faint); font-size: 13px;">Idle</span>
        </div>
        <div class="transcript" id="test-transcript"></div>
      </div>
    </div>
  `;
  document.getElementById("test-toggle").addEventListener("click", toggleTestCall);
}

function setTestStatus(text) {
  const el = document.getElementById("test-status");
  if (el) el.textContent = text;
}

function appendOrUpdateBubble(role, text, existingEl, isFinal) {
  const container = document.getElementById("test-transcript");
  if (!container) return null;
  if (existingEl && existingEl.parentNode === container) {
    existingEl.lastChild.textContent = text;
    existingEl.classList.toggle("partial", !isFinal);
    return existingEl;
  }
  const div = document.createElement("div");
  div.className = "bubble " + (role === "caller" ? "caller" : "ai") + (isFinal ? "" : " partial");
  div.innerHTML = `<span class="who">${role === "caller" ? "Caller (you)" : "AI"}</span>`;
  div.appendChild(document.createTextNode(text));
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function downsampleTo8k(input, inputRate) {
  if (inputRate === 8000) return float32ToInt16(input);
  const ratio = inputRate / 8000;
  const outLength = Math.floor(input.length / ratio);
  const out = new Int16Array(outLength);
  for (let i = 0; i < outLength; i++) {
    const srcIndex = i * ratio;
    const i0 = Math.floor(srcIndex);
    const i1 = Math.min(i0 + 1, input.length - 1);
    const frac = srcIndex - i0;
    const sample = input[i0] * (1 - frac) + input[i1] * frac;
    out[i] = Math.max(-32768, Math.min(32767, Math.round(sample * 32768)));
  }
  return out;
}

function float32ToInt16(input) {
  const out = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    out[i] = Math.max(-32768, Math.min(32767, Math.round(input[i] * 32768)));
  }
  return out;
}

function playTestAudioChunk(arrayBuffer) {
  if (!testAudioCtx) return;
  const int16 = new Int16Array(arrayBuffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
  const buffer = testAudioCtx.createBuffer(1, float32.length, 8000);
  if (buffer.copyToChannel) buffer.copyToChannel(float32, 0);
  else buffer.getChannelData(0).set(float32);
  const src = testAudioCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(testAudioCtx.destination);
  const startAt = Math.max(testAudioCtx.currentTime, testPlayHead);
  src.start(startAt);
  testPlayHead = startAt + buffer.duration;
  testPlayingSources.push(src);
  src.onended = () => {
    testPlayingSources = testPlayingSources.filter((s) => s !== src);
  };
}

function stopTestPlayback() {
  testPlayingSources.forEach((s) => {
    try { s.stop(); } catch { /* already stopped */ }
  });
  testPlayingSources = [];
  if (testAudioCtx) testPlayHead = testAudioCtx.currentTime;
}

function handleTestServerMessage(ev) {
  if (typeof ev.data === "string") {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "status") {
      setTestStatus(msg.text);
    } else if (msg.type === "transcript") {
      if (msg.role === "caller") {
        if (!msg.text.trim()) return;
        const div = appendOrUpdateBubble("caller", msg.text, testLivePartialBubble, msg.isFinal);
        testLivePartialBubble = msg.isFinal ? null : div;
      } else {
        testLivePartialBubble = null;
        appendOrUpdateBubble("ai", msg.text, null, true);
      }
    } else if (msg.type === "cancel") {
      stopTestPlayback();
    } else if (msg.type === "ended") {
      setTestStatus("Call ended (" + msg.reason.replace(/_/g, " ") + ").");
      stopTestCall();
    }
  } else {
    playTestAudioChunk(ev.data);
  }
}

async function startTestCall() {
  try {
    testStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setTestStatus("Microphone permission denied.");
    return;
  }

  testAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  testPlayHead = testAudioCtx.currentTime;
  testPlayingSources = [];
  testActive = true;

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  testSocket = new WebSocket(`${proto}//${location.host}/api/test-call`);
  testSocket.binaryType = "arraybuffer";

  testSocket.addEventListener("message", handleTestServerMessage);
  testSocket.addEventListener("close", () => {
    if (testActive) stopTestCall();
  });
  testSocket.addEventListener("error", () => {
    setTestStatus("Connection error.");
  });

  testSocket.addEventListener("open", () => {
    setTestStatus("Connected — say something.");
    document.getElementById("test-toggle").textContent = "Hang up";

    testSource = testAudioCtx.createMediaStreamSource(testStream);
    testProcessor = testAudioCtx.createScriptProcessor(2048, 1, 1);
    const inRate = testAudioCtx.sampleRate;
    testProcessor.onaudioprocess = (e) => {
      if (!testActive || testSocket.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm = downsampleTo8k(input, inRate);
      testSocket.send(pcm.buffer);
    };
    // onaudioprocess only fires once the node is connected through to a
    // destination — route it through a muted gain so the mic is never
    // actually played back out loud (that would feed back into itself).
    const muteGain = testAudioCtx.createGain();
    muteGain.gain.value = 0;
    testSource.connect(testProcessor);
    testProcessor.connect(muteGain);
    muteGain.connect(testAudioCtx.destination);
  });
}

function stopTestCall() {
  testActive = false;
  if (testSocket && testSocket.readyState === WebSocket.OPEN) {
    try { testSocket.send(JSON.stringify({ type: "hangup" })); } catch { /* closing anyway */ }
  }
  if (testSocket) { try { testSocket.close(); } catch { /* already closed */ } }
  testSocket = null;
  stopTestPlayback();
  if (testProcessor) { testProcessor.disconnect(); testProcessor = null; }
  if (testSource) { testSource.disconnect(); testSource = null; }
  if (testStream) { testStream.getTracks().forEach((t) => t.stop()); testStream = null; }
  if (testAudioCtx) { testAudioCtx.close().catch(() => {}); testAudioCtx = null; }
  const btn = document.getElementById("test-toggle");
  if (btn) btn.textContent = "Start test call";
}

function toggleTestCall() {
  if (testActive) {
    stopTestCall();
    setTestStatus("Call ended.");
    return;
  }
  const transcriptEl = document.getElementById("test-transcript");
  if (transcriptEl) transcriptEl.innerHTML = "";
  testLivePartialBubble = null;
  setTestStatus("Connecting…");
  startTestCall();
}

async function renderProfile() {
  const detailEl = document.getElementById("detail");
  detailEl.innerHTML = '<div class="inner"><p style="color: var(--text-faint)">Loading company profile…</p></div>';

  let tenantConfig;
  try {
    const res = await fetch("/api/tenant-config");
    tenantConfig = await res.json();
  } catch (err) {
    detailEl.innerHTML = '<div class="inner"><p style="color: var(--text-faint)">Failed to load: ' + err + '</p></div>';
    return;
  }

  detailEl.innerHTML = `
    <div class="inner">
      <div class="detail-head"><div><h2>Company profile</h2><div class="meta-line">This is what the AI receptionist knows about your business — edits apply to the next call, no restart needed.</div></div></div>

      <div class="card import-card">
        <label>Tell us about your business</label>
        <div class="hint">Paste or type anything — a description, hours, services, pricing policy, FAQs — and we'll turn it into the AI's knowledge base for you to review below.</div>
        <textarea id="import-text" placeholder="e.g. We're Cerdik Tech, a Petaling Jaya-based supplier of business phone systems. We sell IP-PABX switchboards and VoIP gateways. Open Mon–Fri 9am–6pm. Never quote prices over the phone, refer callers to the quote form."></textarea>

        <div class="import-or">or use a link / file</div>
        <div class="import-row">
          <input type="text" id="import-url" placeholder="https://yourcompany.com" />
        </div>
        <div class="import-row">
          <input type="file" id="import-file" accept=".pdf,.pptx" />
        </div>

        <button type="button" class="btn-primary" id="import-draft-btn">Draft profile</button>
        <div class="import-status" id="import-status"></div>
      </div>

      <details class="card details-card" id="profile-details">
        <summary>Review &amp; edit the details<span class="sub">— what you just drafted, field by field</span></summary>
        <div class="details-body">
          <form id="profile-form">
            ${TENANT_CONFIG_FIELDS.map((f) => `
              <div class="form-field">
                <label for="tc-${f.key}">${escapeHtml(f.label)}</label>
                ${f.hint ? `<div class="hint">${escapeHtml(f.hint)}</div>` : ""}
                ${f.kind === "textarea"
                  ? `<textarea id="tc-${f.key}" name="${f.key}">${escapeHtml(tenantConfig[f.key] || "")}</textarea>`
                  : `<input id="tc-${f.key}" name="${f.key}" type="text" value="${escapeHtml(tenantConfig[f.key] || "")}" />`}
              </div>
            `).join("")}
            <div class="save-bar">
              <button type="submit" class="btn-primary" id="profile-save-btn">Save</button>
              <span class="save-status" id="profile-save-status"></span>
            </div>
          </form>
        </div>
      </details>
    </div>
  `;

  document.getElementById("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("profile-save-btn");
    const status = document.getElementById("profile-save-status");
    const patch = {};
    TENANT_CONFIG_FIELDS.forEach((f) => {
      patch[f.key] = document.getElementById("tc-" + f.key).value;
    });

    btn.disabled = true;
    status.className = "save-status";
    status.textContent = "Saving…";
    try {
      const res = await fetch("/api/tenant-config", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      if (!res.ok) throw new Error(await res.text());
      status.className = "save-status ok";
      status.textContent = "Saved.";
    } catch (err) {
      status.className = "save-status err";
      status.textContent = "Failed to save: " + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  function applyDraft(draft) {
    TENANT_CONFIG_FIELDS.forEach((f) => {
      if (draft[f.key]) document.getElementById("tc-" + f.key).value = draft[f.key];
    });
  }

  async function runImport(payload, buttons) {
    const status = document.getElementById("import-status");
    buttons.forEach((b) => (b.disabled = true));
    status.className = "import-status";
    status.textContent = "Reading and drafting — this can take up to 30s…";
    try {
      const res = await fetch("/api/tenant-config/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(await res.text());
      const draft = await res.json();
      applyDraft(draft);
      document.getElementById("profile-details").open = true;
      status.className = "import-status ok";
      status.textContent = "Draft ready — review it below, then click Save.";
    } catch (err) {
      status.className = "import-status err";
      status.textContent = "Import failed: " + err.message;
    } finally {
      buttons.forEach((b) => (b.disabled = false));
    }
  }

  const importDraftBtn = document.getElementById("import-draft-btn");

  importDraftBtn.addEventListener("click", () => {
    const status = document.getElementById("import-status");
    const text = document.getElementById("import-text").value.trim();
    const url = document.getElementById("import-url").value.trim();
    const file = document.getElementById("import-file").files[0];

    // Whichever of the three the person filled in wins, in this order —
    // typed/pasted text is the primary path the form leads with.
    if (text) {
      runImport({ source: "text", text }, [importDraftBtn]);
    } else if (url) {
      runImport({ source: "url", url }, [importDraftBtn]);
    } else if (file) {
      const reader = new FileReader();
      reader.onload = () => {
        const contentBase64 = reader.result.split(",")[1];
        runImport({ source: "file", filename: file.name, contentBase64 }, [importDraftBtn]);
      };
      reader.onerror = () => {
        status.className = "import-status err";
        status.textContent = "Failed to read file.";
      };
      reader.readAsDataURL(file);
    } else {
      status.className = "import-status err";
      status.textContent = "Type something, paste a link, or choose a file first.";
    }
  });
}

document.getElementById("home-btn").addEventListener("click", () => {
  currentView = "calls";
  selectedId = null;
  render();
  renderHome();
});

document.getElementById("test-btn").addEventListener("click", () => {
  currentView = "test";
  renderTest();
});

document.getElementById("profile-btn").addEventListener("click", () => {
  currentView = "profile";
  renderProfile();
});

document.getElementById("search").addEventListener("input", (e) => {
  query = e.target.value.trim().toLowerCase();
  render();
});

async function refresh() {
  try {
    const res = await fetch("/api/calls");
    calls = await res.json();
    render();
    // Skip rebuilding the detail panel while a dropdown is open, or while the
    // company-profile form is showing — either would otherwise get wiped out
    // mid-click/mid-edit every 3s by this poll.
    if (currentView === "calls" && !document.querySelector(".dd-menu.open")) renderDetail();
  } catch (err) {
    document.getElementById("rows").innerHTML = '<div class="empty">Failed to load calls: ' + err + '</div>';
  }
}

refresh();
setInterval(refresh, 3000);
</script>
