<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cerdik AI Receptionist — Calls</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
  header { padding: 16px 24px; background: #111827; color: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  main { display: flex; height: calc(100vh - 57px); }
  #list { width: 420px; overflow-y: auto; border-right: 1px solid #ddd; background: #fff; }
  #detail { flex: 1; overflow-y: auto; padding: 24px; }
  .row { padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
  .row:hover { background: #f0f3ff; }
  .row.active { background: #e3e9ff; }
  .row .caller { font-weight: 600; }
  .row .meta { font-size: 12px; color: #666; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; color: #fff; margin-left: 6px; }
  .badge.routed { background: #2563eb; }
  .badge.message_taken { background: #d97706; }
  .badge.fallback { background: #dc2626; }
  .badge.hangup { background: #6b7280; }
  .badge.live { background: #16a34a; }
  pre { white-space: pre-wrap; background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #e5e7eb; }
  .empty { color: #888; padding: 24px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .03em; }
</style>
</head>
<body>
<header><h1>Cerdik AI Receptionist — Calls</h1></header>
<main>
  <div id="list"><div class="empty">Loading…</div></div>
  <div id="detail"><div class="empty">Select a call on the left.</div></div>
</main>
<script>
let calls = [];
let selectedId = null;

function badgeClass(outcome) {
  return outcome ? outcome : "live";
}

function fmtTime(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString();
}

function render() {
  const listEl = document.getElementById("list");
  if (calls.length === 0) {
    listEl.innerHTML = '<div class="empty">No calls yet.</div>';
    return;
  }
  listEl.innerHTML = calls.map((c) => `
    <div class="row ${c.callId === selectedId ? "active" : ""}" data-id="${c.callId}">
      <div class="caller">${c.caller || "Unknown caller"}
        <span class="badge ${badgeClass(c.outcome)}">${c.outcome || "in progress"}</span>
      </div>
      <div class="meta">${fmtTime(c.startedAt)}</div>
    </div>
  `).join("");

  listEl.querySelectorAll(".row").forEach((el) => {
    el.addEventListener("click", () => {
      selectedId = el.dataset.id;
      render();
      renderDetail();
    });
  });
}

function renderDetail() {
  const detailEl = document.getElementById("detail");
  const call = calls.find((c) => c.callId === selectedId);
  if (!call) {
    detailEl.innerHTML = '<div class="empty">Select a call on the left.</div>';
    return;
  }
  detailEl.innerHTML = `
    <div class="field"><label>Caller</label>${call.caller || "—"}</div>
    <div class="field"><label>Started</label>${fmtTime(call.startedAt)}</div>
    <div class="field"><label>Ended</label>${fmtTime(call.endedAt)}</div>
    <div class="field"><label>Outcome</label>${call.outcome || "in progress"}${call.routedTo ? " → " + call.routedTo : ""}</div>
    ${call.message ? `<div class="field"><label>Message taken</label>${call.message}</div>` : ""}
    <div class="field"><label>Transcript</label><pre>${(call.transcript || "(no transcript yet)").replace(/</g, "&lt;")}</pre></div>
  `;
}

async function refresh() {
  try {
    const res = await fetch("/api/calls");
    calls = await res.json();
    render();
    renderDetail();
  } catch (err) {
    document.getElementById("list").innerHTML = '<div class="empty">Failed to load calls: ' + err + '</div>';
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
